<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineGo - Streaming</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">CineGo<span>▶</span></div>
    </header>

    <main>
        <section id="bienvenida">
            <h1>Bienvenido a CineGo</h1>
            <p>Tu Cine, a donde vayas.</p>
        </section>

        <section id="planes">
            <div class="card">
                <h3>Básico</h3>
                <p class="precio">$99 MXN/mes</p>
                <button onclick="seleccionarPlan('Básico')">Suscribirse</button>
            </div>
            <div class="card">
                <h3>Estándar</h3>
                <p class="precio">$149 MXN/mes</p>
                <button onclick="seleccionarPlan('Estándar')">Suscribirse</button>
            </div>
            <div class="card destacada">
                <h3>Premium</h3>
                <p class="precio">$199 MXN/mes</p>
                <button onclick="seleccionarPlan('Premium')">Suscribirse</button>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
<section id="area-pago" style="display:none; background:#111; padding:20px; border-radius:10px; margin-top:20px;">
    <h2>Finalizar Suscripción</h2>
    <p>Estás contratando el Plan <span id="plan-seleccionado"></span></p>
    
    <form id="form-pago">
        <input type="text" placeholder="Nombre en la tarjeta" required style="width:90%; padding:10px; margin:5px;">
        <input type="text" placeholder="0000 0000 0000 0000" required style="width:90%; padding:10px; margin:5px;">
        <div style="display:flex; justify-content:center; gap:10px;">
            <input type="text" placeholder="MM/AA" style="width:40%; padding:10px;">
            <input type="text" placeholder="CVV" style="width:40%; padding:10px;">
        </div>
        <button type="submit" style="margin-top:15px; width:95%;">Confirmar Pago Seguro</button>
    </form>
</section>
